{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}University Hub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'academic/style.css' %}">
</head>
<body>
    <nav>
        <h1>University Hub Portal</h1>
        <a href="/">Home</a> 
        <a href="/academic/course/">Courses</a> | <a href="/admin/">Admin</a>
        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}!</span>
            
            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Login</a> | <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>

    <hr>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    </hr>

    <footer>
        <p>© 2026 University Hub Systems </p>
    </footer>
</body>
</html>
